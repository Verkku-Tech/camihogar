name: Deploy Camihogar PRD

on:
  push:
    branches: ["main"]

concurrency:
  group: camihogar-rpi
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has-changes: ${{ steps.set-matrix.outputs.has-changes }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            security-api:
              - 'Ordina.Backend/src/Application/Security/**'
              - 'Ordina.Backend/src/Infrastructure/**'
              - 'Ordina.Backend/*.props'
              - 'Ordina.Backend/*.sln'
              - 'docker-compose.yml'
              - '.github/workflows/deploy-rpi-prd.yml'
            users-api:
              - 'Ordina.Backend/src/Application/Users/**'
              - 'Ordina.Backend/src/Infrastructure/**'
              - 'Ordina.Backend/*.props'
              - 'Ordina.Backend/*.sln'
              - 'docker-compose.yml'
              - '.github/workflows/deploy-rpi-prd.yml'
            providers-api:
              - 'Ordina.Backend/src/Application/Providers/**'
              - 'Ordina.Backend/src/Infrastructure/**'
              - 'Ordina.Backend/*.props'
              - 'Ordina.Backend/*.sln'
              - 'docker-compose.yml'
              - '.github/workflows/deploy-rpi-prd.yml'
            orders-api:
              - 'Ordina.Backend/src/Application/Orders/**'
              - 'Ordina.Backend/src/Infrastructure/**'
              - 'Ordina.Backend/*.props'
              - 'Ordina.Backend/*.sln'
              - 'docker-compose.yml'
              - '.github/workflows/deploy-rpi-prd.yml'
            payments-api:
              - 'Ordina.Backend/src/Application/Payments/**'
              - 'Ordina.Backend/src/Infrastructure/**'
              - 'Ordina.Backend/*.props'
              - 'Ordina.Backend/*.sln'
              - 'docker-compose.yml'
              - '.github/workflows/deploy-rpi-prd.yml'
            stores-api:
              - 'Ordina.Backend/src/Application/Stores/**'
              - 'Ordina.Backend/src/Infrastructure/**'
              - 'Ordina.Backend/*.props'
              - 'Ordina.Backend/*.sln'
              - 'docker-compose.yml'
              - '.github/workflows/deploy-rpi-prd.yml'
            apigateway:
              - 'Ordina.Backend/src/Presentation/Ordina.ApiGateway/**'
              - 'Ordina.Backend/src/Infrastructure/**'
              - 'Ordina.Backend/*.props'
              - 'Ordina.Backend/*.sln'
              - 'docker-compose.yml'
              - '.github/workflows/deploy-rpi-prd.yml'
            frontend:
              - 'Ordina.Frontend/**'
              - 'docker-compose.yml'
              - '.github/workflows/deploy-rpi-prd.yml'

      - name: Build Matrix JSON
        id: set-matrix
        run: |
          SERVICES=()
          if [ "${{ steps.filter.outputs.security-api }}" == "true" ]; then
            SERVICES+=('{"name":"security-api","context":"./Ordina.Backend","file":"./Ordina.Backend/src/Application/Security/Ordina.Security.Api/Dockerfile"}')
          fi
          if [ "${{ steps.filter.outputs.users-api }}" == "true" ]; then
            SERVICES+=('{"name":"users-api","context":"./Ordina.Backend","file":"./Ordina.Backend/src/Application/Users/Ordina.Users.Api/Dockerfile"}')
          fi
          if [ "${{ steps.filter.outputs.providers-api }}" == "true" ]; then
            SERVICES+=('{"name":"providers-api","context":"./Ordina.Backend","file":"./Ordina.Backend/src/Application/Providers/Ordina.Providers.Api/Dockerfile"}')
          fi
          if [ "${{ steps.filter.outputs.orders-api }}" == "true" ]; then
            SERVICES+=('{"name":"orders-api","context":"./Ordina.Backend","file":"./Ordina.Backend/src/Application/Orders/Ordina.Orders.Api/Dockerfile"}')
          fi
          if [ "${{ steps.filter.outputs.payments-api }}" == "true" ]; then
            SERVICES+=('{"name":"payments-api","context":"./Ordina.Backend","file":"./Ordina.Backend/src/Application/Payments/Ordina.Payments.Api/Dockerfile"}')
          fi
          if [ "${{ steps.filter.outputs.stores-api }}" == "true" ]; then
            SERVICES+=('{"name":"stores-api","context":"./Ordina.Backend","file":"./Ordina.Backend/src/Application/Stores/Ordina.Stores.Api/Dockerfile"}')
          fi
          if [ "${{ steps.filter.outputs.apigateway }}" == "true" ]; then
            SERVICES+=('{"name":"apigateway","context":"./Ordina.Backend","file":"./Ordina.Backend/src/Presentation/Ordina.ApiGateway/Dockerfile"}')
          fi
          if [ "${{ steps.filter.outputs.frontend }}" == "true" ]; then
            SERVICES+=('{"name":"frontend","context":"./Ordina.Frontend","file":"./Ordina.Frontend/Dockerfile"}')
          fi

          if [ ${#SERVICES[@]} -eq 0 ]; then
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
          else
            JSON=$(IFS=,; echo "[${SERVICES[*]}]")
            echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    name: Build & Push ${{ matrix.service.name }} (ARM64)
    needs: changes
    if: needs.changes.outputs.has-changes == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        run: |
          echo "REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.file }}
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}-${{ matrix.service.name }}:latest
            ghcr.io/${{ env.REPO_LOWER }}-${{ matrix.service.name }}:${{ github.sha }}

  deploy:
    name: Deploy to Raspberry Pi 5
    needs: [changes, build-and-push]
    if: always() && !cancelled() && needs.changes.outputs.has-changes == 'true' && !contains(needs.*.result, 'failure')
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Setup Docker Permissions
        run: |
          set -euo pipefail
          echo "=== Verificando acceso a Docker ==="
          echo "Usuario: $(whoami) | Grupos: $(groups)"
          if docker ps >/dev/null 2>&1; then
            echo "✓ Docker accesible (usuario en grupo docker)"
          else
            echo "✗ El usuario no puede usar Docker. En la RPi ejecuta:"
            echo "  sudo usermod -aG docker runner"
            echo "  sudo systemctl restart actions.runner.Verkku-Tech-camihogar.camihogar-prd.service"
            docker ps
            exit 1
          fi

      - name: Ensure curl exists
        run: |
          set -euo pipefail
          command -v curl >/dev/null 2>&1 || (echo "curl no encontrado; instálalo en la RPi con: sudo apt-get install -y curl" && exit 1)

      - name: Pull Latest Docker Images
        run: |
          set -euo pipefail
          echo "=== Descargando capas modificadas desde GHCR ==="
          docker compose pull

      - name: Deploy Services
        run: |
          set -euo pipefail
          echo "=== Desplegando todos los servicios ==="
          docker compose up -d --remove-orphans

      - name: Wait for Services Warmup
        run: |
          set -euo pipefail
          echo "=== Esperando a que los servicios estén listos ==="
          timeout=60
          interval=2
          elapsed=0

          while [ $elapsed -lt $timeout ]; do
            if curl -fsS "http://localhost:8082/health" >/dev/null 2>&1 && \
               curl -fsS "http://localhost:3000" >/dev/null 2>&1; then
              echo "Contenedores listos y respondiendo. Continuando..."
              break
            fi
            echo "Aún iniciando servicios... ($elapsed/$timeout)"
            sleep $interval
            elapsed=$((elapsed + interval))
          done

          echo "=== Estado de contenedores ==="
          docker compose ps

      - name: Health Check
        run: |
          set -euo pipefail
          echo "=== Verificando salud de los servicios ==="

          apis=("8082:security-api" "8083:users-api" "8084:providers-api" "8085:orders-api" "8086:payments-api" "8087:stores-api")
          failed=0

          for api in "${apis[@]}"; do
            port="${api%%:*}"
            name="${api##*:}"
            if curl -fsS "http://localhost:$port/health" >/dev/null 2>&1 || curl -fsS "http://localhost:$port" >/dev/null 2>&1; then
              echo "✓ $name (puerto $port) está respondiendo"
            else
              echo "✗ $name (puerto $port) no está respondiendo"
              failed=$((failed + 1))
            fi
          done

          if curl -fsS "http://localhost:3000" >/dev/null 2>&1; then
            echo "✓ Frontend está respondiendo"
          else
            echo "✗ Frontend no está respondiendo"
            failed=$((failed + 1))
          fi

          if [ $failed -gt 0 ]; then
            echo "⚠️  Algunos servicios no están respondiendo correctamente"
            docker compose ps || true
            docker compose logs --tail=80 || true
            exit 1
          fi

          echo "✓ Todos los servicios están funcionando correctamente"

      - name: Cleanup
        if: always()
        run: |
          set -euo pipefail
          echo "=== Limpiando imágenes huérfanas (preservando caché de capas) ==="
          docker image prune -f || true
          echo "=== Espacio en disco después de limpieza ==="
          df -h
