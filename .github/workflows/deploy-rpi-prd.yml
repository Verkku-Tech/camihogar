name: Deploy Camihogar PRD

on:
  push:
    branches: ["main"]

concurrency:
  group: camihogar-rpi
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.service.name }} (ARM64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: security-api
            context: ./Ordina.Backend
            file: ./Ordina.Backend/src/Application/Security/Ordina.Security.Api/Dockerfile
          - name: users-api
            context: ./Ordina.Backend
            file: ./Ordina.Backend/src/Application/Users/Ordina.Users.Api/Dockerfile
          - name: providers-api
            context: ./Ordina.Backend
            file: ./Ordina.Backend/src/Application/Providers/Ordina.Providers.Api/Dockerfile
          - name: orders-api
            context: ./Ordina.Backend
            file: ./Ordina.Backend/src/Application/Orders/Ordina.Orders.Api/Dockerfile
          - name: payments-api
            context: ./Ordina.Backend
            file: ./Ordina.Backend/src/Application/Payments/Ordina.Payments.Api/Dockerfile
          - name: stores-api
            context: ./Ordina.Backend
            file: ./Ordina.Backend/src/Application/Stores/Ordina.Stores.Api/Dockerfile
          - name: apigateway
            context: ./Ordina.Backend
            file: ./Ordina.Backend/src/Presentation/Ordina.ApiGateway/Dockerfile
          - name: frontend
            context: ./Ordina.Frontend
            file: ./Ordina.Frontend/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        run: |
          echo "REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.file }}
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}-${{ matrix.service.name }}:latest
            ghcr.io/${{ env.REPO_LOWER }}-${{ matrix.service.name }}:${{ github.sha }}

  deploy:
    name: Deploy to Raspberry Pi 5
    needs: build-and-push
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Setup Docker Permissions
        run: |
          set -euo pipefail
          echo "=== Verificando acceso a Docker ==="
          echo "Usuario: $(whoami) | Grupos: $(groups)"
          if docker ps >/dev/null 2>&1; then
            echo "✓ Docker accesible (usuario en grupo docker)"
          else
            echo "✗ El usuario no puede usar Docker. En la RPi ejecuta:"
            echo "  sudo usermod -aG docker runner"
            echo "  sudo systemctl restart actions.runner.Verkku-Tech-camihogar.camihogar-prd.service"
            docker ps
            exit 1
          fi

      - name: Ensure curl exists
        run: |
          set -euo pipefail
          command -v curl >/dev/null 2>&1 || (echo "curl no encontrado; instálalo en la RPi con: sudo apt-get install -y curl" && exit 1)

      - name: Pull Latest Docker Images
        run: |
          set -euo pipefail
          echo "=== Descargando imágenes precompiladas desde GHCR ==="
          docker compose pull

      - name: Deploy Services
        run: |
          set -euo pipefail
          echo "=== Desplegando todos los servicios ==="
          docker compose up -d --remove-orphans

      - name: Wait for Services Warmup
        run: |
          set -euo pipefail
          echo "=== Esperando a que los servicios estén listos ==="
          timeout=180
          interval=5
          elapsed=0

          while [ $elapsed -lt $timeout ]; do
            if curl -fsS "http://localhost:8082/health" >/dev/null 2>&1 && \
               curl -fsS "http://localhost:3000" >/dev/null 2>&1; then
              echo "Contenedores listos y respondiendo. Continuando..."
              break
            fi
            echo "Aún iniciando servicios... ($elapsed/$timeout)"
            sleep $interval
            elapsed=$((elapsed + interval))
          done

          echo "=== Estado de contenedores ==="
          docker compose ps

      - name: Health Check
        run: |
          set -euo pipefail
          echo "=== Verificando salud de los servicios ==="

          apis=("8082:security-api" "8083:users-api" "8084:providers-api" "8085:orders-api" "8086:payments-api" "8087:stores-api")
          failed=0

          for api in "${apis[@]}"; do
            port="${api%%:*}"
            name="${api##*:}"
            if curl -fsS "http://localhost:$port/health" >/dev/null 2>&1 || curl -fsS "http://localhost:$port" >/dev/null 2>&1; then
              echo "✓ $name (puerto $port) está respondiendo"
            else
              echo "✗ $name (puerto $port) no está respondiendo"
              failed=$((failed + 1))
            fi
          done

          if curl -fsS "http://localhost:3000" >/dev/null 2>&1; then
            echo "✓ Frontend está respondiendo"
          else
            echo "✗ Frontend no está respondiendo"
            failed=$((failed + 1))
          fi

          if [ $failed -gt 0 ]; then
            echo "⚠️  Algunos servicios no están respondiendo correctamente"
            docker compose ps || true
            docker compose logs --tail=80 || true
            exit 1
          fi

          echo "✓ Todos los servicios están funcionando correctamente"

      - name: Cleanup
        if: always()
        run: |
          set -euo pipefail
          echo "=== Limpiando imágenes no utilizadas ==="
          docker image prune -af || true
          echo "=== Espacio en disco después de limpieza ==="
          df -h
