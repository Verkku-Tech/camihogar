# =====================================================================
# SonarQube Project Configuration for Camihogar / Ordina
# =====================================================================

# Identificación del Proyecto
sonar.projectKey=camihogar-ordina
sonar.projectName=Camihogar Ordina Monolith & SPA
sonar.projectVersion=2.0.0

# Fuentes y Pruebas
sonar.sources=Ordina.Backend/src,Ordina.Frontend/src
sonar.tests=Ordina.Backend/tests,Ordina.Frontend/tests
sonar.sourceEncoding=UTF-8

# Exclusiones de Análisis
sonar.exclusions=**/obj/**,**/bin/**,**/dist/**,**/node_modules/**,**/wwwroot/**,**/*.spec.ts,**/*.test.ts,**/*.d.ts
sonar.coverage.exclusions=**/tests/**,**/Program.cs,**/Dockerfile,**/wwwroot/**

# Cobertura de Código .NET (OpenCover / Cobertura)
sonar.cs.opencover.reportsPaths=Ordina.Backend/tests/**/TestResults/**/coverage.opencover.xml

# Cobertura de Código Frontend (LCOV)
sonar.javascript.lcov.reportPaths=Ordina.Frontend/coverage/lcov.info
