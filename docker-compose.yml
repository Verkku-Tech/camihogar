services:
  # 1. Base de Datos MongoDB (Única fuente de verdad)
  mongodb:
    image: mongo:7.0
    container_name: ordina-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=OrdinaPassword123!
    volumes:
      - mongodb_data:/data/db
    networks:
      - ordina-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. .NET Aspire Standalone Dashboard (Monitoreo OTLP & Logs centralizados)
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    container_name: ordina-aspire-dashboard
    restart: unless-stopped
    ports:
      - "18888:18888" # UI Dashboard
      - "4317:4317"   # OTLP gRPC
    environment:
      - ASPNETCORE_URLS=http://+:18888
      - DOTNET_DASHBOARD_OTLP_ENDPOINT_URL=http://+:4317
      - DASHBOARD__OTLP__PRIMARYENDPOINTURL=http://+:4317
      - DOTNET_DASHBOARD_OTLP_AUTH_MODE=Unsecured
      - DASHBOARD__OTLP__AUTHMODE=Unsecured
      - DASHBOARD__FRONTEND__AUTHMODE=BrowserToken
      - DASHBOARD__FRONTEND__BROWSERTOKEN=Camihogar_Aspire_2026_x89aF72kQz!
    networks:
      - ordina-network

  # 3. Monolito Modular Backend (.NET 10 ReadyToRun)
  backend-api:
    image: ghcr.io/verkku-tech/camihogar-backend-api:latest
    build:
      context: ./Ordina.Backend
      dockerfile: src/Api/Dockerfile
    container_name: ordina-backend-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__MongoDB=mongodb://admin:OrdinaPassword123!@mongodb:27017/camihogar?authSource=admin
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:4317
      - OTEL_SERVICE_NAME=Ordina.Api
      - Jwt__SecretKey=OrdinaSuperSecretKeyForDevelopmentMustBeAtLeast32CharsLong!
      - Jwt__Issuer=OrdinaApi
      - Jwt__Audience=OrdinaClients
      - Cors__AllowedOrigins__0=http://localhost:5173
      - Cors__AllowedOrigins__1=http://localhost:3000
      - Cors__AllowedOrigins__2=https://camihogar.pages.dev
    depends_on:
      mongodb:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    networks:
      - ordina-network

  # 4. Frontend SPA PWA (Vite + React 19)
  frontend:
    image: ghcr.io/verkku-tech/camihogar-frontend:latest
    build:
      context: ./Ordina.Frontend
      dockerfile: Dockerfile
    container_name: ordina-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend-api
    networks:
      - ordina-network

networks:
  ordina-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
